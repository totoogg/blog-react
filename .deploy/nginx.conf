server {
    listen 80;
    listen [::]:80;
    server_name blog-react2.ru www.blog-react2.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blog-react2.ru www.blog-react2.ru;

    root /var/www/blog_react/html;
    index index.html index.htm index.nginx-debian.html;

    ssl_certificate /etc/letsencrypt/live/blog-react2.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog-react2.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ~ ^/api/(.*)$ {
        proxy_pass https://79.174.80.18:8443/$1$is_args$args;
        proxy_ssl_verify off; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}